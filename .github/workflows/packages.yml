name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            package_command: npm run package:linux
            artifact: turing-terminal-linux-x64-v*.tar.gz
          - os: windows-latest
            target: windows
            package_command: npm run package:windows
            artifact: turing-terminal-windows-x64-v*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux package
        if: matrix.target == 'linux'
        run: ${{ matrix.package_command }}
      - name: Build Windows package
        if: matrix.target == 'windows'
        shell: pwsh
        run: ${{ matrix.package_command }}
      - uses: actions/upload-artifact@v4
        with:
          name: turing-terminal-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
