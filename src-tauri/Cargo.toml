[package]
name = "turing-terminal"
version = "1.0.0-rc2"
description = "Turing Terminal desktop shell"
authors = ["Turing Terminal"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
